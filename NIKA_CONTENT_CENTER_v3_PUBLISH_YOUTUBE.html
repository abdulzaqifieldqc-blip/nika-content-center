<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a3d">
<title>NIKA CONTENT CENTER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071a3d;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:20px 16px 34px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{font-size:22px;font-weight:900}.logo span{color:#6ea8ff}
.status{font-size:11px;padding:7px 10px;border:1px solid #294878;border-radius:20px;color:#a9c7f7}
h1{font-size:29px;line-height:1.1;margin:8px 0 7px}.sub{color:#9db2d4;font-size:14px;margin-bottom:22px}
.card{background:#102957;border:1px solid #1e3b68;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #0002}
label{display:block;font-size:12px;color:#a9bee0;font-weight:700;margin:0 0 8px}
input,textarea,select{width:100%;border:1px solid #31517f;background:#091f46;color:#fff;border-radius:12px;padding:13px;font-size:14px;outline:none}
textarea{min-height:105px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#6ea8ff}
.drop{border:1.5px dashed #5275a8;background:#0a2149;border-radius:16px;padding:25px 15px;text-align:center;cursor:pointer}.drop b{display:block;font-size:15px;margin-bottom:5px}.drop small{color:#8fa8ce}
.platforms{display:grid;grid-template-columns:1fr 1fr;gap:9px}.platform{display:flex;align-items:center;gap:9px;border:1px solid #31517f;background:#0a2149;border-radius:12px;padding:12px;font-size:13px}.platform input{width:auto;accent-color:#6ea8ff}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:900;color:#071a3d;background:#fff;cursor:pointer;margin-top:4px}.btn:disabled{opacity:.55}
.note{font-size:11px;color:#819bc3;text-align:center;margin-top:12px;line-height:1.5}.preview{display:none;margin-top:12px;padding:10px;border-radius:12px;background:#0a2149;color:#a9c7f7;font-size:12px}
.result{display:none;margin-top:14px;border-radius:14px;padding:13px;font-size:13px;line-height:1.5;background:#0a2149;border:1px solid #31517f}.result a{color:#8fc0ff}.ok{border-color:#3e9b6d}.err{border-color:#b65b66}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="logo">NIKA <span>CONTENT CENTER</span></div><div class="status">YouTube Connected</div></div>
<h1>Publish Content</h1><div class="sub">Satu video, satu caption, kirim ke banyak platform.</div>

<div class="card">
<label>VIDEO</label>
<div class="drop" onclick="document.getElementById('video').click()"><b>＋ Pilih video</b><small>MP4 • Maks. 50 MB untuk tahap POC</small><input id="video" type="file" accept="video/*" hidden></div>
<div id="preview" class="preview"></div>
</div>

<div class="card">
<label>JUDUL</label><input id="title" placeholder="Contoh: NIKA Content Test">
<div style="height:14px"></div><label>CAPTION / DESKRIPSI</label><textarea id="description" placeholder="Tulis caption atau deskripsi video..."></textarea>
<div style="height:14px"></div><label>HASHTAG</label><input id="tags" placeholder="#NIKA #Content #Indonesia">
</div>

<div class="card">
<label>PLATFORM</label>
<div class="platforms">
<label class="platform"><input id="yt" type="checkbox" checked> YouTube</label>
<label class="platform"><input type="checkbox" disabled> TikTok</label>
<label class="platform"><input type="checkbox" disabled> Instagram</label>
<label class="platform"><input type="checkbox" disabled> Facebook</label>
</div>
<div style="height:14px"></div><label>VISIBILITAS YOUTUBE</label>
<select id="privacy"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select>
</div>

<button class="btn" id="publishBtn" onclick="publish()">PUBLISH CONTENT</button>
<div id="result" class="result"></div>
<div class="note">POC YouTube aktif. Platform lain akan diaktifkan setelah API masing-masing selesai.</div>
</div>

<script>
const SUPABASE_URL="https://zawhkoayeqaiyhojbelw.supabase.co";
const SUPABASE_KEY="sb_publishable_GNqNN0bBQ2SP1qsu8JI1wg_8gipAR7A";
const PUBLISH_FUNCTION=SUPABASE_URL+"/functions/v1/publish-youtube";
const video=document.getElementById("video"),preview=document.getElementById("preview"),result=document.getElementById("result"),btn=document.getElementById("publishBtn");

video.addEventListener("change",()=>{
 const f=video.files[0];
 if(!f){preview.style.display="none";return}
 preview.style.display="block";preview.textContent=`${f.name} • ${(f.size/1024/1024).toFixed(2)} MB`;
});
function showResult(message,ok=false){result.style.display="block";result.className="result "+(ok?"ok":"err");result.innerHTML=message}
async function publish(){
 const f=video.files[0],title=document.getElementById("title").value.trim(),description=document.getElementById("description").value.trim(),tagsRaw=document.getElementById("tags").value.trim(),privacy=document.getElementById("privacy").value;
 if(!f)return showResult("Pilih video terlebih dahulu.");
 if(!title)return showResult("Isi judul terlebih dahulu.");
 if(f.size>50*1024*1024)return showResult("Video lebih dari 50 MB. Gunakan video maksimal 50 MB untuk POC.");
 btn.disabled=true;btn.textContent="MENGUPLOAD...";result.style.display="none";
 try{
  const safeName=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=`uploads/${Date.now()}-${safeName}`;
  const storageRes=await fetch(`${SUPABASE_URL}/storage/v1/object/videos/${encodeURIComponent(path)}`,{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":f.type||"video/mp4","x-upsert":"false"},
   body:f
  });
  if(!storageRes.ok)throw new Error("Upload Storage gagal: "+await storageRes.text());
  const videoUrl=`${SUPABASE_URL}/storage/v1/object/public/videos/${path}`;
  btn.textContent="MENGIRIM KE YOUTUBE...";
  const tags=tagsRaw.split(/\s+/).map(x=>x.replace(/^#/,"")).filter(Boolean);
  const res=await fetch(PUBLISH_FUNCTION,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({video_url:videoUrl,title,description,tags,category_id:"22",privacy_status:privacy})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.success)throw new Error(data.error||data.message||JSON.stringify(data));
  showResult(`✅ <b>Upload YouTube berhasil!</b><br>Video ID: ${data.video_id}<br>Privasi: ${data.privacy_status}<br><a href="${data.youtube_url}" target="_blank">Buka video YouTube</a>`,true);
 }catch(e){showResult("❌ "+(e.message||"Terjadi kesalahan."))}
 finally{btn.disabled=false;btn.textContent="PUBLISH CONTENT"}
}
</script>
</body>
</html>
